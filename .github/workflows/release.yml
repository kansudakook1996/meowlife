name: Release

# Runs when you push a version tag, e.g.  git tag v0.1.0 && git push origin v0.1.0
on:
  push:
    tags: ['v*.*.*']

permissions:
  contents: write # needed to create the GitHub Release and upload the installer

jobs:
  release:
    runs-on: windows-latest
    env:
      # GITHUB_TOKEN is created by GitHub for this run only. It is never stored in the app.
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Check tag matches package.json version
        shell: bash
        run: |
          PKG="v$(node -p "require('./package.json').version")"
          if [ "$PKG" != "$GITHUB_REF_NAME" ]; then
            echo "Tag $GITHUB_REF_NAME does not match package.json version $PKG"; exit 1
          fi
      - run: npm run verify
      - run: npx playwright test
      # Create ONE draft release first. If electron-builder creates it, parallel uploads can
      # create duplicate releases for the same tag (happened with v0.1.0).
      - name: Create draft release with Thai notes from CHANGELOG
        shell: bash
        run: |
          node scripts/release-notes.cjs "${GITHUB_REF_NAME#v}" > release-notes.md
          gh release create "$GITHUB_REF_NAME" --draft --title "MeowLife ${GITHUB_REF_NAME#v}" --notes-file release-notes.md
      - name: Build installer and upload to the draft
        run: npx electron-builder --win --publish always
      - name: Publish the release
        shell: bash
        run: |
          gh release view "$GITHUB_REF_NAME" --json assets --jq '.assets[].name'
          gh release edit "$GITHUB_REF_NAME" --draft=false --latest
